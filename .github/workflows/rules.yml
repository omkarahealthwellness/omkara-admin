name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firebase/firestore.rules'
      - 'firebase/firestore.indexes.json'

jobs:
  deploy-rules:
    name: Deploy Security Rules
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only firestore:rules --project ${{ secrets.FIREBASE_PROJECT_ID }}
          echo "✅ Firestore rules deployed from CI"

      - name: Deploy Firestore Indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }}
          echo "✅ Firestore indexes deployed from CI"
